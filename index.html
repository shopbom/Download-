<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop Bom - Download</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.download-box {
    width: 100%;
    max-width: 400px;

    background: #050505;

    border: 1px solid #333;
    border-radius: 22px;

    padding: 32px 24px;

    text-align: center;

    box-shadow: 0 0 30px rgba(255,255,255,0.08);
}

/* LOGO */

.logo {
    width: 90px;
    height: 90px;

    margin: 0 auto 18px;

    border-radius: 22px;

    overflow: hidden;

    background: #fff;

    border: 1px solid #444;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TITLE */

h1 {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
}

.description {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

/* STATS */

.stats {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
}

.stat {
    flex: 1;

    background: #0b0b0b;

    border: 1px solid #333;

    border-radius: 15px;

    padding: 17px 8px;
}

.icon {
    font-size: 22px;
    margin-bottom: 7px;
}

.number {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
}

.label {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
}

/* DOWNLOAD BUTTON */

.download-btn {
    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.download-btn:hover {
    background: #ddd;
}

.download-btn:active {
    transform: scale(0.98);
}

/* STATUS */

.status {
    margin-top: 14px;

    font-size: 12px;

    color: #777;

    min-height: 16px;
}

.info {
    margin-top: 20px;

    font-size: 11px;

    color: #444;
}
</style>

</head>

<body>

<div class="download-box">

    <!-- LOGO -->

    <div class="logo">

        <img
            src="https://i.ibb.co/cctkH8kY/file-00000000913c81faa77b111104adff2d.png"
            alt="Shop Bom">

    </div>


    <!-- TITLE -->

    <h1>Shop Bom</h1>

    <p class="description">
        Download the latest version of Shop Bom Android App.
    </p>


    <!-- VIEWS + DOWNLOADS -->

    <div class="stats">

        <div class="stat">

            <div class="icon">
                👁️
            </div>

            <div
                class="number"
                id="views">
                0
            </div>

            <div class="label">
                Views
            </div>

        </div>


        <div class="stat">

            <div class="icon">
                📥
            </div>

            <div
                class="number"
                id="downloads">
                0
            </div>

            <div class="label">
                Downloads
            </div>

        </div>

    </div>


    <!-- DOWNLOAD BUTTON -->

    <button
        class="download-btn"
        onclick="downloadAPK()">

        ⬇ DOWNLOAD APK

    </button>


    <div
        class="status"
        id="status">

        Download will start automatically...

    </div>


    <div class="info">
        Android APK • Shop Bom
    </div>

</div>


<script>

/*
=================================================
SHOP BOM
LOCAL STORAGE ONLY
=================================================

No Firebase
No Supabase
No API
No Backend
No Cookies
No Tracking ID
=================================================
*/


/* APK FILE */

const APK_FILE = "./Shop%20Bom.apk";


/* STORAGE */

const VIEWS_KEY = "shopbom_views";

const DOWNLOADS_KEY = "shopbom_downloads";


/* GET CURRENT VALUES */

let views =
    parseInt(localStorage.getItem(VIEWS_KEY)) || 0;

let downloads =
    parseInt(localStorage.getItem(DOWNLOADS_KEY)) || 0;


/* ADD VIEW */

views++;

localStorage.setItem(
    VIEWS_KEY,
    views
);


/* SHOW VALUES */

document.getElementById("views").textContent =
    views.toLocaleString();

document.getElementById("downloads").textContent =
    downloads.toLocaleString();


/*
=================================================
DOWNLOAD APK
=================================================
*/

function downloadAPK() {

    /* Add download */

    downloads++;

    localStorage.setItem(
        DOWNLOADS_KEY,
        downloads
    );


    /* Update download number */

    document.getElementById("downloads").textContent =
        downloads.toLocaleString();


    /* Status */

    document.getElementById("status").textContent =
        "Download started...";


    /* Create download link */

    const link = document.createElement("a");

    link.href = APK_FILE;

    link.download = "Shop Bom.apk";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


/*
=================================================
AUTOMATIC DOWNLOAD
=================================================

Wait 2 seconds after page opens.
=================================================
*/

window.addEventListener("load", function() {

    setTimeout(function() {

        downloadAPK();

    }, 2000);

});

</script>

</body>
</html>
